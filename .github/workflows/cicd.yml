name: Atelier CI/CD

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: atelier-flask

jobs:
  Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest
      - name: Lancer les tests
        run: pytest -v tests/

  Docker:
    runs-on: ubuntu-latest
    needs: Tests
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .
      - name: Exporter l'image
        run: docker save $IMAGE_NAME:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-docker
          path: image.tar

  Production:
    runs-on: ubuntu-latest
    needs: Docker
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-docker
      - name: Charger l'image
        run: docker load -i image.tar
      - name: Démarrer le conteneur
        run: docker run -d -p 4000:4000 --name app $IMAGE_NAME:${{ github.sha }}
      - name: Vérifier que l'application répond
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:4000/ && exit 0
            sleep 3
          done
          docker logs app
          exit 1
      - name: Message de succès
        run: echo "### ✅ Mise en production réussie" >> $GITHUB_STEP_SUMMARY
